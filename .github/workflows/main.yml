name: Monthly Camarilla S3 Scan
on:
  schedule:
    - cron: "30 13 1 * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance pandas numpy
      - name: Get latest NIFTY 500 list
        run: python get_nifty500.py symbols.txt || echo "Download failed, using symbols.txt from repo"
      - run: python scanner.py symbols.txt docs/index.html
      - run: python green_reclaim_scanner.py symbols.txt docs/green_reclaim.html
      - name: Commit result
        run: |
          git config user.name "scanner-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/index.html docs/green_reclaim.html
          git commit -m "Monthly scan" || echo "No changes"
          git push
